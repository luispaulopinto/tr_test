name: TR probe

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check BC TR series
        id: check
        run: |
          DETECTED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          HTTP_RESPONSE=$(curl -sS -w '\n%{http_code}' "https://api.bcb.gov.br/dados/serie/bcdata.sgs.226/dados/ultimos/5?formato=json")
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n 1)
          BODY=$(echo "$HTTP_RESPONSE" | sed '$d')

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "$DETECTED_AT;error;;;http_$HTTP_STATUS" >> log.csv
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "summary=Erro HTTP $HTTP_STATUS (detectado $DETECTED_AT)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_DATE=$(echo "$BODY" | jq -r '.[-1].data' 2>/dev/null || true)
          LATEST_VALUE=$(echo "$BODY" | jq -r '.[-1].valor' 2>/dev/null || true)

          if [ -z "$LATEST_DATE" ] || [ "$LATEST_DATE" = "null" ]; then
            echo "$DETECTED_AT;error;;;invalid_json" >> log.csv
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "summary=Resposta 200 mas JSON inválido (detectado $DETECTED_AT)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_OK_DATE=$(grep ';ok;' log.csv 2>/dev/null | tail -n 1 | cut -d';' -f3 || true)

          if [ "$LATEST_DATE" != "$LAST_OK_DATE" ]; then
            echo "$DETECTED_AT;ok;$LATEST_DATE;$LATEST_VALUE;" >> log.csv
            mkdir -p snapshots
            echo "$BODY" > "snapshots/$LATEST_DATE.json"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "summary=TR nova: $LATEST_DATE = $LATEST_VALUE (detectada $DETECTED_AT)" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit log if changed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "tr-probe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "${{ steps.check.outputs.summary }}"
          git push
